name: Build & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach artifacts to (e.g. v1.1.0); leave empty to only build"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  FLET_VERSION: "1.1.2"

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern 'version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build Windows EXE
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows.ps1
      - name: Prepare asset name
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Copy-Item "dist/充电监控.exe" "dist/EVCharge-v$v-Windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/EVCharge-*-Windows-x64.exe
          if-no-files-found: error

  macos:
    name: macOS APP / DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Read version
        id: ver
        run: |
          VERSION=$(python3 -c 'import re,pathlib;print(re.search(r"version\s*=\s*\"([^\"]+)\"", pathlib.Path("pyproject.toml").read_text()).group(1))')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build macOS APP / DMG
        env:
          FLET_VERSION: ${{ env.FLET_VERSION }}
        run: bash scripts/build_macos.sh --lean
      - name: Package artifacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then ARCH=x64; fi
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "充电监控.app" "EVCharge-v${VERSION}-macOS-${ARCH}.zip"
          if [ -f "充电监控-${VERSION}.dmg" ]; then mv "充电监控-${VERSION}.dmg" "EVCharge-v${VERSION}-macOS-${ARCH}.dmg"; fi
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            dist/EVCharge-*-macOS.zip
            dist/EVCharge-*-macOS.dmg
          if-no-files-found: warn

  release:
    name: Publish Release
    needs: [windows, macos]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: List files
        run: ls -lh assets || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          body_path: .github/release-body.md
          files: assets/*
          fail_on_unmatched_files: false
          overwrite_files: true
